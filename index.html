<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kharcha — Money Manager</title>
<meta name="theme-color" content="#4834D4">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#F3F4FB; --surface:#FFFFFF; --surface-2:#F3F5FC; --ink:#181B34; --ink-soft:#5B6178;
  --muted:#9AA0B8; --border:#E7E9F5;
  --grad-1:#7C6CF0; --grad-2:#4834D4; --primary:#5B4CE0; --primary-ink:#FFFFFF;
  --accent:#F5A623; --accent-2:#FFD166; --accent-soft:#FFF3DC;
  --income:#00B894; --income-2:#00D8A8; --income-soft:#E1FBF4;
  --expense:#FF5E62; --expense-2:#FF9966; --expense-soft:#FFE9E8;
  --teal:#17C3B2; --pink:#F45B8D; --blue:#3D8BFD;
  --radius-s:12px; --radius-m:18px; --radius-l:26px;
  --shadow-sm:0 1px 2px rgba(24,27,52,.05), 0 2px 8px rgba(24,27,52,.05);
  --shadow-md:0 4px 14px rgba(24,27,52,.07), 0 12px 32px rgba(24,27,52,.06);
  --shadow-lg:0 8px 26px rgba(72,52,212,.16), 0 2px 8px rgba(24,27,52,.08);
  --glow-primary:0 10px 24px -6px rgba(91,76,224,.5);
  --glow-income:0 8px 20px -6px rgba(0,184,148,.45);
  --glow-expense:0 8px 20px -6px rgba(255,94,98,.4);
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --ease-spring:cubic-bezier(.34,1.56,.64,1); --ease-out:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0D1C; --surface:#151830; --surface-2:#1B1E3A; --ink:#EDEFFB; --ink-soft:#B4B8D4;
    --muted:#7A7FA0; --border:#292D52; --grad-1:#8A7BFA; --grad-2:#5C4AE8; --primary:#8A7BFA;
    --accent-soft:#3A2E12; --income-soft:#0E2E27; --expense-soft:#3A1C1D;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 2px 8px rgba(0,0,0,.25);
    --shadow-md:0 4px 14px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.3);
    --glow-primary:0 10px 26px -6px rgba(138,123,250,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0D1C; --surface:#151830; --surface-2:#1B1E3A; --ink:#EDEFFB; --ink-soft:#B4B8D4;
  --muted:#7A7FA0; --border:#292D52; --grad-1:#8A7BFA; --grad-2:#5C4AE8; --primary:#8A7BFA;
  --accent-soft:#3A2E12; --income-soft:#0E2E27; --expense-soft:#3A1C1D;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:var(--safe-bottom); overscroll-behavior-y:none; position:relative;
}
html{scroll-padding-top:var(--safe-top);}
button{font-family:inherit;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
body::before, body::after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none;}
body::before{width:340px;height:340px;top:-120px;right:-100px;background:radial-gradient(circle,var(--grad-1),transparent 70%);}
body::after{width:300px;height:300px;bottom:-100px;left:-100px;background:radial-gradient(circle,var(--accent),transparent 70%);opacity:.18;}

.shell{position:relative;z-index:1;display:flex;min-height:100vh;}
.sidebar{display:none;}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.app-inner{max-width:560px;margin:0 auto;width:100%;padding-top:var(--safe-top);}
.sidebar{width:250px;flex:none;padding:26px 16px;flex-direction:column;gap:6px;border-right:1px solid var(--border);position:sticky;top:0;height:100vh;}
.side-brand{display:flex;align-items:center;gap:10px;padding:6px 12px 26px;}
.side-brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--grad-1),var(--grad-2));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--glow-primary);}
.side-brand .name{font-size:16.5px;font-weight:800;letter-spacing:-.02em;}
.side-nav-btn{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius-s);border:none;background:transparent;color:var(--ink-soft);font-size:14px;font-weight:600;cursor:pointer;text-align:left;transition:background .18s,color .18s,transform .15s;}
.side-nav-btn .ic{font-size:18px;width:22px;text-align:center;}
.side-nav-btn:hover{background:var(--surface-2);color:var(--ink);}
.side-nav-btn.active{background:linear-gradient(135deg,var(--grad-1),var(--grad-2));color:#fff;box-shadow:var(--glow-primary);}
.side-nav-btn:active{transform:scale(.97);}
.side-fab{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:var(--radius-s);border:none;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#3A2E00;font-weight:800;font-size:13.5px;box-shadow:0 10px 22px -8px rgba(245,166,35,.55);transition:transform .15s;}
.side-fab:hover{transform:translateY(-2px);}
.side-fab:active{transform:scale(.96);}
.side-foot{margin-top:auto;padding:12px;font-size:11px;color:var(--muted);line-height:1.5;}

.topbar{position:relative;overflow:hidden;padding:calc(16px + var(--safe-top)) 20px 18px;margin-top:calc(-1 * var(--safe-top));background:linear-gradient(135deg,var(--grad-1) 0%,var(--grad-2) 100%);color:#fff;border-radius:0 0 var(--radius-l) var(--radius-l);box-shadow:var(--shadow-lg);}
.topbar::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%);top:-90px;right:-60px;}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;}
.brand{display:flex;align-items:center;gap:8px;}
.brand-mark{font-size:18px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:7px;}
.brand-mark .dot{width:9px;height:9px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 4px rgba(255,209,102,.25);}
.month-switch{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.14);border-radius:999px;padding:4px;backdrop-filter:blur(6px);}
.month-switch button{width:26px;height:26px;border:none;border-radius:50%;background:transparent;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,transform .15s;}
.month-switch button:hover{background:rgba(255,255,255,.22);}
.month-switch button:active{transform:scale(.85);}
.month-label{font-size:12.5px;font-weight:700;min-width:80px;text-align:center;}
.settings-btn{width:26px;height:26px;border:none;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;}

.balance-block{margin-top:18px;position:relative;animation:flip3D .55s var(--ease-out) both;}
.balance-label{font-size:12px;opacity:.78;font-weight:600;}
.balance-amount{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums;}
.stat-row{display:flex;gap:10px;margin-top:18px;position:relative;}
.stat-pill{flex:1;background:rgba(255,255,255,.12);border-radius:var(--radius-m);padding:11px 14px;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);transition:transform .2s var(--ease-out);animation:popIn3D .5s var(--ease-out) both;}
.stat-pill:nth-child(2){animation-delay:.08s;}
.stat-pill:hover{transform:translateY(-2px);}
.stat-pill .k{font-size:11px;opacity:.78;display:flex;align-items:center;gap:5px;}
.stat-pill .v{font-size:16.5px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;}
.stat-pill.income .v{color:#8CFFD6;}
.stat-pill.expense .v{color:#FFC1B8;}

.content{flex:1;padding:20px 18px 110px;position:relative;perspective:1000px;}
.section-title{font-size:14.5px;font-weight:800;margin:24px 0 11px;display:flex;align-items:center;justify-content:space-between;color:var(--ink);letter-spacing:-.01em;}
.section-title .link{font-size:12px;font-weight:700;color:var(--primary);cursor:pointer;transition:opacity .15s;}
.section-title .link:hover{opacity:.7;}
.card{background:var(--surface);border-radius:var(--radius-m);box-shadow:var(--shadow-sm);padding:17px;border:1px solid var(--border);transition:box-shadow .25s var(--ease-out),transform .25s var(--ease-out);}
@media (hover:hover) and (pointer:fine){ .card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);} }
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:30px 10px;}
.empty .big{font-size:30px;display:block;margin-bottom:8px;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

@keyframes contentEnter3D{from{opacity:0;transform:perspective(900px) rotateX(8deg) translateY(16px);}to{opacity:1;transform:perspective(900px) rotateX(0) translateY(0);}}
.content > *{animation:contentEnter3D .5s var(--ease-out) both;}
.content > *:nth-child(1){animation-delay:.02s;}
.content > *:nth-child(2){animation-delay:.07s;}
.content > *:nth-child(3){animation-delay:.12s;}
.content > *:nth-child(4){animation-delay:.17s;}
.content > *:nth-child(5){animation-delay:.22s;}
.content > *:nth-child(6){animation-delay:.27s;}
.content > *:nth-child(7){animation-delay:.32s;}
.content > *:nth-child(8){animation-delay:.37s;}
.content > *:nth-child(n+9){animation-delay:.4s;}
@keyframes flip3D{0%{opacity:0;transform:perspective(700px) rotateX(-70deg);}100%{opacity:1;transform:perspective(700px) rotateX(0);}}
@keyframes popIn3D{from{opacity:0;transform:perspective(600px) rotateY(-25deg) scale(.9);}to{opacity:1;transform:perspective(600px) rotateY(0) scale(1);}}
@keyframes iconPop3D{0%{transform:perspective(400px) rotateX(80deg) scale(.5);opacity:0;}100%{transform:perspective(400px) rotateX(0) scale(1);opacity:1;}}

.dash-grid{display:block;}
.dash-col{min-width:0;}

.pie-wrap{display:flex;align-items:center;gap:20px;}
.pie{width:132px;height:132px;border-radius:50%;flex:none;position:relative;background:conic-gradient(var(--surface-2) 0 100%);box-shadow:inset 0 2px 10px rgba(0,0,0,.05), var(--shadow-sm);animation:popIn .55s var(--ease-spring) both;}
@keyframes popIn{from{opacity:0;transform:scale(.7) rotate(-40deg);}to{opacity:1;transform:scale(1) rotate(0);}}
.pie-center{position:absolute;inset:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.06) inset;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pie-center .t{font-size:9.5px;color:var(--muted);font-weight:700;}
.pie-center .v{font-size:12.5px;font-weight:800;color:var(--ink);}
.legend{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.legend-dot{width:9px;height:9px;border-radius:50%;flex:none;}
.legend-name{flex:1;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}
.legend-pct{font-weight:800;color:var(--ink);display:flex;align-items:center;gap:4px;}

.tip{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--border);}
.tip:first-child{border-top:none;padding-top:2px;}
.tip-icon{font-size:17px;flex:none;width:32px;height:32px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;}
.tip-text{font-size:13px;color:var(--ink-soft);line-height:1.5;padding-top:4px;}
.tip-text b{color:var(--ink);}

.txn{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border);transition:background .15s;}
.txn:first-child{border-top:none;}
.txn-icon{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;box-shadow:inset 0 -2px 4px rgba(0,0,0,.05);}
.txn-main{flex:1;min-width:0;}
.txn-cat{font-size:13.5px;font-weight:700;color:var(--ink);}
.txn-note{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txn-amt{font-size:14px;font-weight:800;flex:none;font-variant-numeric:tabular-nums;}
.txn-amt.income{color:var(--income);}
.txn-amt.expense{color:var(--expense);}
.txn-del{border:none;background:transparent;color:var(--muted);font-size:15px;padding:6px;cursor:pointer;flex:none;border-radius:50%;transition:background .15s,color .15s;}
.txn-del:hover{background:var(--expense-soft);color:var(--expense);}

.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}
.cat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:15px 8px;text-align:center;cursor:pointer;transition:transform .2s var(--ease-out),box-shadow .2s;position:relative;}
.cat-edit-btn{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;border:none;background:var(--surface-2);color:var(--muted);font-size:10.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;}
.cat-tile:hover{transform:perspective(600px) rotateX(4deg) translateY(-3px);box-shadow:var(--shadow-md);}
.cat-tile:active{transform:scale(.96);}
.cat-tile .ic{width:42px;height:42px;border-radius:13px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:inset 0 -3px 6px rgba(0,0,0,.06);}
.cat-tile .nm{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cat-tile .amt{font-size:10.5px;color:var(--muted);margin-top:2px;font-weight:600;}
.cat-tile.add{border-style:dashed;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--surface-2);}
.cat-tile.add .ic{background:var(--surface);color:var(--primary);box-shadow:none;}
.tile-budget-track{height:4px;background:var(--surface-2);border-radius:3px;margin-top:7px;overflow:hidden;}
.tile-budget-fill{height:100%;border-radius:3px;transition:width .7s var(--ease-out);}

.rec-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--border);}
.rec-row:first-child{border-top:none;}
.rec-main{flex:1;min-width:0;cursor:pointer;}
.rec-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:4px;}
.rec-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
.rec-amt{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;}
.switch{width:40px;height:23px;border-radius:999px;background:var(--border);position:relative;cursor:pointer;flex:none;border:none;transition:background .2s;}
.switch.on{background:linear-gradient(135deg,var(--income),var(--income-2));}
.switch::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .22s var(--ease-spring);box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch.on::after{transform:translateX(17px);}

.bar-row{margin-bottom:13px;}
.bar-row-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;}
.bar-row-top .nm{color:var(--ink-soft);font-weight:600;}
.bar-row-top .amt{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums;}
.bar-track{height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;width:0;transition:width 1s var(--ease-out);}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;background:var(--surface);border-top:1px solid var(--border);padding:8px 6px calc(8px + var(--safe-bottom));display:flex;justify-content:space-around;box-shadow:0 -4px 20px rgba(24,27,52,.06);}
.tab{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;padding:5px 10px;cursor:pointer;flex:1;transition:color .18s,transform .15s;}
.tab .ic{font-size:19px;transition:transform .18s var(--ease-spring);}
.tab.active{color:var(--primary);}
.tab.active .ic{transform:translateY(-2px) scale(1.08);animation:iconPop3D .4s var(--ease-spring) both;}
.tab:active{transform:scale(.92);}
.tab.fab .ic{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#3A2E00;display:flex;align-items:center;justify-content:center;font-size:23px;margin-top:-20px;box-shadow:0 8px 18px -6px rgba(245,166,35,.6);}
.tab.fab:active .ic{transform:scale(.9);}

.sheet-overlay{position:fixed;inset:0;background:rgba(11,13,28,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s;backdrop-filter:blur(2px);}
.sheet-overlay.show{opacity:1;pointer-events:auto;}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:var(--radius-l) var(--radius-l) 0 0;padding:18px 20px calc(22px + var(--safe-bottom));max-height:88vh;overflow-y:auto;transform:perspective(1000px) rotateX(10deg) translateY(26px);transform-origin:bottom center;transition:transform .3s var(--ease-spring);box-shadow:0 -12px 40px rgba(24,27,52,.18);}
.sheet-overlay.show .sheet{transform:perspective(1000px) rotateX(0) translateY(0);}
.sheet-handle{width:38px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 16px;}
.sheet-title{font-size:17.5px;font-weight:800;margin-bottom:18px;letter-spacing:-.01em;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:7px;}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:var(--radius-s);background:var(--surface-2);color:var(--ink);font-size:14.5px;font-family:inherit;transition:border-color .15s,box-shadow .15s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(91,76,224,.12);}
.seg{display:flex;gap:8px;}
.seg button{flex:1;padding:11px;border-radius:var(--radius-s);border:1.5px solid var(--border);background:var(--surface-2);color:var(--ink-soft);font-weight:700;font-size:13px;cursor:pointer;transition:all .18s;}
.seg button.active{background:var(--surface);border-color:var(--primary);color:var(--primary);}
.seg button.active.income{background:var(--income-soft);border-color:var(--income);color:var(--income);}
.seg button.active.expense{background:var(--expense-soft);border-color:var(--expense);color:var(--expense);}
.icon-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:6px;}
.icon-grid button{aspect-ratio:1;border-radius:11px;border:1.5px solid var(--border);background:var(--surface-2);font-size:16px;cursor:pointer;transition:transform .15s,border-color .15s;}
.icon-grid button:hover{transform:scale(1.08);}
.icon-grid button.active{border-color:var(--primary);background:linear-gradient(135deg,#EFECFF,#F7F5FF);transform:scale(1.05);}
.color-grid{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px;}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .15s;}
.color-dot:hover{transform:scale(1.12);}
.color-dot.active{border-color:var(--ink);transform:scale(1.15);}
.btn{width:100%;padding:14px;border-radius:var(--radius-s);border:none;background:linear-gradient(135deg,var(--grad-1),var(--grad-2));color:#fff;font-size:14.5px;font-weight:800;cursor:pointer;margin-top:6px;box-shadow:var(--glow-primary);transition:transform .15s,box-shadow .15s;}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:scale(.97);}
.btn.secondary{background:var(--surface-2);color:var(--ink);border:1.5px solid var(--border);box-shadow:none;}
.btn.danger{background:var(--expense-soft);color:var(--expense);box-shadow:none;}
.btn-row{display:flex;gap:10px;margin-top:4px;}
.btn-row .btn{margin-top:0;}

.toast{position:fixed;left:50%;bottom:calc(94px + var(--safe-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:11px 14px 11px 20px;border-radius:999px;font-size:12.5px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:12px;max-width:90vw;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}

<body>
<div class="shell" id="shell"></div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const LS_KEY = "kharcha_data_v1";
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const ICONS = ["🍔","🚌","🛍️","💡","🎬","🏥","📚","🏠","✈️","🎉","☕","📱","💰","💵","🎁","🧾","🐾","⚽","🧴","➕"];
const COLORS = ["#FF5E62","#00B894","#F5A623","#5B4CE0","#8952C4","#F45B8D","#17C3B2","#3D8BFD","#F0933D","#2E9E6B"];
const FREQ_LABELS = {daily:"Daily",every10:"10-din",weekly:"Weekly",monthly:"Monthly",quarterly:"Quarterly",halfyearly:"Half-yearly",yearly:"Yearly"};
const ACT_ICON = {add:"➕",edit:"✎",delete:"🗑️",restore:"↩️"};

function defaultData(){
  return {
    categories:[
      {id:"c_food",name:"Khana / Food",type:"expense",icon:"🍔",color:"#FF5E62",budget:null},
      {id:"c_transport",name:"Transport",type:"expense",icon:"🚌",color:"#F0933D",budget:null},
      {id:"c_shopping",name:"Shopping",type:"expense",icon:"🛍️",color:"#8952C4",budget:null},
      {id:"c_bills",name:"Bills & Rent",type:"expense",icon:"💡",color:"#5B4CE0",budget:null},
      {id:"c_entertainment",name:"Entertainment",type:"expense",icon:"🎬",color:"#F45B8D",budget:null},
      {id:"c_health",name:"Health",type:"expense",icon:"🏥",color:"#3D8BFD",budget:null},
      {id:"c_other",name:"Other",type:"expense",icon:"🧾",color:"#2E9E6B",budget:null},
      {id:"c_salary",name:"Salary",type:"income",icon:"💰",color:"#00B894",budget:null},
      {id:"c_extra",name:"Extra Income",type:"income",icon:"💵",color:"#17C3B2",budget:null},
    ],
    transactions:[],
    recurring:[],
    groups:[],
    activityLog:[],
    botChat:[],
    reminders:[],
    meta:{createdAt:Date.now()}
  };
}

let DB = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultData();
    const parsed = JSON.parse(raw);
    if(!parsed.categories || !parsed.transactions) return defaultData();
    if(!parsed.groups) parsed.groups = [];
    if(!parsed.recurring) parsed.recurring = [];
    if(!parsed.activityLog) parsed.activityLog = [];
    if(!parsed.botChat) parsed.botChat = [];
    if(!parsed.reminders) parsed.reminders = [];
    return parsed;
  }catch(e){ return defaultData(); }
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
  catch(e){ toast("Storage full ya block ho gaya — data save nahi hua"); }
  document.dispatchEvent(new CustomEvent('kharcha:save'));
}
function logActivity(type, message){
  DB.activityLog.unshift({id:uid(), ts:Date.now(), type, message});
  if(DB.activityLog.length>300) DB.activityLog.length = 300;
}
function timeAgo(ts){
  const diff = Math.floor((Date.now()-ts)/1000);
  if(diff<60) return "abhi abhi";
  if(diff<3600) return Math.floor(diff/60)+" min pehle";
  if(diff<86400) return Math.floor(diff/3600)+" ghante pehle";
  const d = Math.floor(diff/86400);
  if(d<30) return d+" din pehle";
  return fmtDate(ts);
}

function fmtINR(n){
  n = Math.round(n);
  const neg = n < 0; n = Math.abs(n);
  let s = n.toString();
  let last3 = s.slice(-3), rest = s.slice(0,-3);
  if(rest !== "") last3 = "," + last3;
  rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ",");
  return (neg?"-":"") + "₹" + rest + last3;
}
function fmtDate(d){
  d = new Date(d);
  return d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
}
function monthKey(d){ d=new Date(d); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function monthLabel(d){ return d.toLocaleDateString("en-IN",{month:"long",year:"numeric"}); }
function freqLabel(r){
  if(r.frequency==="custom"){
    const unit = r.customUnit==="days"?"din":r.customUnit==="weeks"?"hafte":"mahine";
    return `Har ${r.customVal||1} ${unit}`;
  }
  return FREQ_LABELS[r.frequency]||r.frequency;
}

let state = {
  tab: "dashboard",
  month: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  group: null,
  txnSearch: "",
  txnFilterType: "all",
};
let prevStats = {balance:0, income:0, expense:0};

function nextDateFor(dateStr, freq, customVal, customUnit){
  const d = new Date(dateStr);
  if(freq==="daily") d.setDate(d.getDate()+1);
  else if(freq==="every10") d.setDate(d.getDate()+10);
  else if(freq==="weekly") d.setDate(d.getDate()+7);
  else if(freq==="monthly") d.setMonth(d.getMonth()+1);
  else if(freq==="quarterly") d.setMonth(d.getMonth()+3);
  else if(freq==="halfyearly") d.setMonth(d.getMonth()+6);
  else if(freq==="yearly") d.setFullYear(d.getFullYear()+1);
  else if(freq==="custom"){
    const v = Math.max(1, parseInt(customVal)||1);
    if(customUnit==="weeks") d.setDate(d.getDate()+v*7);
    else if(customUnit==="months") d.setMonth(d.getMonth()+v);
    else d.setDate(d.getDate()+v);
  }
  else d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}
function monthlyMult(r){
  const m = {daily:30, every10:3, weekly:4.33, monthly:1, quarterly:1/3, halfyearly:1/6, yearly:1/12};
  if(r.frequency==="custom"){
    const v = Math.max(1, r.customVal||1);
    if(r.customUnit==="days") return 30/v;
    if(r.customUnit==="weeks") return 4.33/v;
    if(r.customUnit==="months") return 1/v;
  }
  return m[r.frequency] ?? 1;
}
function runRecurringEngine(){
  const today = new Date().toISOString().slice(0,10);
  let created = 0;
  DB.recurring.forEach(r=>{
    if(!r.active) return;
    let guard = 0;
    while(r.nextDate <= today && guard < 366){
      DB.transactions.push({
        id: uid(), categoryId: r.categoryId, amount: r.amount,
        note: (r.note? r.note+" ": "") + "(Auto)", date: r.nextDate,
        type: r.type, recurringId: r.id, history: []
      });
      r.lastRun = r.nextDate;
      r.nextDate = nextDateFor(r.nextDate, r.frequency, r.customVal, r.customUnit);
      created++; guard++;
    }
  });
  if(created>0) save();
  return created;
}

function catById(id){ return DB.categories.find(c=>c.id===id); }
function txnsForMonth(monthDate){
  const key = monthKey(monthDate);
  return DB.transactions.filter(t=> t.date.slice(0,7)===key );
}
function totals(txns){
  let income=0, expense=0;
  txns.forEach(t=> t.type==="income" ? income+=t.amount : expense+=t.amount );
  return {income, expense, balance: income-expense};
}
function categoryBreakdown(txns, type="expense"){
  const map = {};
  txns.filter(t=>t.type===type).forEach(t=>{
    map[t.categoryId] = (map[t.categoryId]||0) + t.amount;
  });
  return Object.entries(map)
    .map(([categoryId, amount])=>({categoryId, amount, cat: catById(categoryId)}))
    .filter(x=>x.cat)
    .sort((a,b)=>b.amount-a.amount);
}
function weekdayBreakdown(txns){
  const names=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const sums=[0,0,0,0,0,0,0];
  txns.filter(t=>t.type==="expense").forEach(t=>{
    let d = new Date(t.date).getDay();
    d = (d+6)%7;
    sums[d]+=t.amount;
  });
  return names.map((n,i)=>({name:n, amount:sums[i]}));
}
function highestExpense(txns){
  const exp = txns.filter(t=>t.type==="expense");
  if(!exp.length) return null;
  return exp.reduce((a,b)=> b.amount>a.amount? b:a);
}
function dailyAverage(monthDate, txns){
  const now = new Date();
  const isCurrentMonth = monthDate.getFullYear()===now.getFullYear() && monthDate.getMonth()===now.getMonth();
  const daysInMonth = new Date(monthDate.getFullYear(), monthDate.getMonth()+1, 0).getDate();
  const daysElapsed = isCurrentMonth? now.getDate() : daysInMonth;
  return totals(txns).expense / Math.max(1,daysElapsed);
}

function buildTips(){
  const tips = [];
  const cur = txnsForMonth(state.month);
  const curT = totals(cur);
  const prevMonth = new Date(state.month.getFullYear(), state.month.getMonth()-1, 1);
  const prevT = totals(txnsForMonth(prevMonth));
  const breakdown = categoryBreakdown(cur, "expense");

  if(cur.length===0){
    tips.push({icon:"👋", text:"Is mahine abhi tak koi entry nahi hai. Transaction add karke shuru karo — analysis aur tips yahin dikhenge."});
    return tips;
  }
  if(curT.expense > curT.income && curT.income>0){
    tips.push({icon:"⚠️", text:`Is mahine kharcha (<b>${fmtINR(curT.expense)}</b>) income (<b>${fmtINR(curT.income)}</b>) se zyada ho gaya hai. Agle hafte non-zaroori kharche kam karo.`});
  } else if(curT.income>0){
    const rate = Math.round(((curT.income-curT.expense)/curT.income)*100);
    if(rate>=20) tips.push({icon:"🎉", text:`Badhiya! Is mahine tumne income ka <b>${rate}%</b> bacha liya hai. Isi tarah continue karo.`});
    else if(rate>=0) tips.push({icon:"💡", text:`Is mahine saving rate sirf <b>${rate}%</b> hai. Kam se kam 20% bachane ki koshish karo.`});
  }
  if(breakdown.length){
    const top = breakdown[0];
    const pct = Math.round((top.amount/curT.expense)*100);
    if(pct>=35){
      tips.push({icon:"📌", text:`<b>${top.cat.name}</b> par tumhara sabse zyada kharcha ho raha hai — kul kharche ka <b>${pct}%</b>. Yahan budget set karke dekho.`});
    }
  }
  if(prevT.expense>0){
    const diff = curT.expense - prevT.expense;
    const pct = Math.abs(Math.round((diff/prevT.expense)*100));
    if(diff>0 && pct>=15) tips.push({icon:"📈", text:`Pichle mahine se kharcha <b>${pct}% zyada</b> hai (${fmtINR(prevT.expense)} → ${fmtINR(curT.expense)}).`});
    else if(diff<0 && pct>=15) tips.push({icon:"📉", text:`Pichle mahine se kharcha <b>${pct}% kam</b> hua hai — shabash!`});
  }
  const activeRecurring = DB.recurring.filter(r=>r.active && r.type==="expense");
  if(activeRecurring.length){
    const monthlyCommit = activeRecurring.reduce((s,r)=> s + r.amount*monthlyMult(r), 0);
    if(curT.income>0 && monthlyCommit/curT.income > 0.5){
      tips.push({icon:"🔁", text:`Recurring (auto) kharche tumhari income ka <b>${Math.round(monthlyCommit/curT.income*100)}%</b> khaa rahe hain. Inhe review karo.`});
    }
  }
  const smallDaily = breakdown.find(b=> b.cat.id==="c_food" || b.cat.name.toLowerCase().includes("khana"));
  if(smallDaily && smallDaily.amount > 3000){
    tips.push({icon:"🍽️", text:`Khane-peene par is mahine <b>${fmtINR(smallDaily.amount)}</b> kharch hue. Ghar ka khana thoda badha kar bahar ke kharche kam ho sakte hain.`});
  }
  DB.categories.filter(c=>c.budget).forEach(c=>{
    const spent = cur.filter(t=>t.categoryId===c.id && t.type==='expense').reduce((s,t)=>s+t.amount,0);
    if(spent > c.budget){
      tips.push({icon:"🚨", text:`<b>${c.name}</b> ka budget (${fmtINR(c.budget)}) cross ho gaya hai — abhi tak <b>${fmtINR(spent)}</b> kharch ho chuke hain.`});
    } else if(spent > c.budget*0.8){
      tips.push({icon:"⏳", text:`<b>${c.name}</b> budget ka <b>${Math.round(spent/c.budget*100)}%</b> use ho chuka hai.`});
    }
  });
  const highest = highestExpense(cur);
  if(highest && curT.expense>0 && highest.amount/curT.expense>0.25){
    const hc = catById(highest.categoryId);
    tips.push({icon:"💸", text:`Sabse bada single kharcha: <b>${fmtINR(highest.amount)}</b> (${hc?.name||'-'}, ${fmtDate(highest.date)}) — is mahine ke kul kharche ka bada hissa yahin gaya.`});
  }
  if(tips.length===0) tips.push({icon:"✅", text:"Sab theek chal raha hai. Roz apni entries add karte raho taaki analysis accurate rahe."});
  return tips.slice(0,6);
}

let toastTimer;
function toast(msg, action){
  const el = $("#toast");
  el.innerHTML = `<span>${msg}</span>` + (action? `<button class="toast-undo" id="toastActionBtn">${action.label}</button>` : "");
  el.classList.add("show");
  clearTimeout(toastTimer);
  if(action){
    $("#toastActionBtn").onclick = ()=>{ action.onClick(); el.classList.remove("show"); clearTimeout(toastTimer); };
  }
  toastTimer = setTimeout(()=>el.classList.remove("show"), action?4200:2200);
}

function animateNumber(el, from, to, duration, fmt){
  if(!el) return;
  if(Math.abs(from-to)<1){ el.textContent = fmt(to); return; }
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = fmt(from + (to-from)*eased);
    if(p<1) requestAnimationFrame(tick);
    else el.textContent = fmt(to);
  }
  requestAnimationFrame(tick);
}
function animateBars(){
  requestAnimationFrame(()=>{ $$(".bar-fill[data-w]").forEach(el=>{ el.style.width = el.dataset.w; }); });
}
function animateBarsIn(container){
  requestAnimationFrame(()=>{ $$(".bar-fill[data-w]", container).forEach(el=>{ el.style.width = el.dataset.w; }); });
}

const NAV = [
  {id:"dashboard", ic:"🏠", label:"Home"},
  {id:"transactions", ic:"📋", label:"Entries"},
  {id:"categories", ic:"🗂️", label:"Category"},
  {id:"split", ic:"🤝", label:"Split bill"},
  {id:"recurring", ic:"🔁", label:"Recurring"},
  {id:"analysis", ic:"📊", label:"Analysis"},
];

function render(){
  const shell = $("#shell");
  const focusInfo = captureFocus();
  shell.innerHTML = `
    ${renderSidebar()}
    <div class="main-col">
      <div class="app-inner">
        ${renderTopbar()}
        <div class="content">${renderTab()}</div>
      </div>
    </div>
    ${renderTabbar()}
    <button class="assistant-fab" id="assistantFab" title="Assistant">🤖</button>
  `;
  bindGlobalEvents();
  animateBars();
  restoreFocus(focusInfo);
  const t = totals(txnsForMonth(state.month));
  animateNumber($("#balanceValue"), prevStats.balance, t.balance, 700, fmtINR);
  animateNumber($("#incomeValue"), prevStats.income, t.income, 700, fmtINR);
  animateNumber($("#expenseValue"), prevStats.expense, t.expense, 700, fmtINR);
  prevStats = t;
}
function captureFocus(){
  const el = document.activeElement;
  if(el && el.id==="txnSearch"){
    return {id:"txnSearch", pos:el.selectionStart};
  }
  return null;
}
function restoreFocus(info){
  if(!info) return;
  const el = $("#"+info.id);
  if(el){ el.focus(); try{ el.setSelectionRange(info.pos, info.pos); }catch(e){} }
}

function renderSidebar(){
  return `
  <div class="sidebar">
    <div class="side-brand"><div class="logo">💸</div><div class="name">Kharcha</div></div>
    ${NAV.map(n=>`
      <button class="side-nav-btn ${state.tab===n.id?'active':''}" data-tab="${n.id}">
        <span class="ic">${n.ic}</span><span>${n.label}</span>
      </button>`).join("")}
    <button class="side-fab" data-tab="add">＋ Nayi entry</button>
    <div class="side-foot">Sara data sirf is device par, offline save hota hai.</div>
  </div>`;
}

function renderTopbar(){
  return `
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand"><span class="brand-mark"><span class="dot"></span>Kharcha</span></div>
      <div class="month-switch">
        <button data-act="prevMonth">‹</button>
        <span class="month-label">${monthLabel(state.month)}</span>
        <button data-act="nextMonth">›</button>
      </div>
    </div>
    <div class="balance-block">
      <div class="balance-label">Is mahine ka balance</div>
      <div class="balance-amount" id="balanceValue">₹0</div>
    </div>
    <div class="stat-row">
      <div class="stat-pill income"><div class="k">↗ Income</div><div class="v" id="incomeValue">₹0</div></div>
      <div class="stat-pill expense"><div class="k">↘ Expense</div><div class="v" id="expenseValue">₹0</div></div>
    </div>
  </div>`;
}

function renderTabbar(){
  const tabs = [
    {id:"dashboard", ic:"🏠", label:"Home"},
    {id:"transactions", ic:"📋", label:"Entries"},
    {id:"add", ic:"+", label:"Add", fab:true},
    {id:"split", ic:"🤝", label:"Split"},
    {id:"categories", ic:"🗂️", label:"Category"},
    {id:"analysis", ic:"📊", label:"Analysis"},
  ];
  return `<div class="tabbar">
    ${tabs.map(t=>`
      <button class="tab ${t.fab?'fab':''} ${state.tab===t.id?'active':''}" data-tab="${t.id}">
        <span class="ic">${t.ic}</span>
        ${!t.fab? `<span>${t.label}</span>`: ''}
      </button>
    `).join("")}
  </div>`;
}

function renderTab(){
  if(state.tab==="dashboard") return renderDashboard();
  if(state.tab==="transactions") return renderTransactions();
  if(state.tab==="categories") return renderCategories();
  if(state.tab==="recurring") return renderRecurring();
  if(state.tab==="analysis") return renderAnalysis();
  if(state.tab==="split") return renderSplit();
  return "";
}

function renderDashboard(){
  const cur = txnsForMonth(state.month);
  const breakdown = categoryBreakdown(cur,"expense");
  const totalExp = breakdown.reduce((s,b)=>s+b.amount,0);
  const tips = buildTips();
  const recent = [...cur].sort((a,b)=> b.date.localeCompare(a.date)).slice(0,6);
  const activeRec = DB.recurring.filter(r=>r.active);

  const pieCSS = totalExp>0 ? (function(){
    let acc=0, stops=[];
    breakdown.forEach(b=>{

function renderSplit(){
  const groups = DB.groups;
  const gid = state.group || groups[0]?.id;
  const g = groups.find(x=>x.id===gid);
  let html = `

  <div class="hint" style="margin-bottom:14px;">Room ke saathiyon ya trip ke doston ke saath shared kharcha track karo — kaun kisko kitna dega turant pata chal jayega.</div>`;
  if(!groups.length){
    html += `<div class="card"><div class="empty"><span class="big">🤝</span>Koi group nahi hai. Room ya trip ke liye pehla group banao.</div></div>`;
    return html;
  }
  html += `<div class="cat-grid" style="grid-template-columns:repeat(auto-fill,minmax(108px,1fr));">
    ${groups.map(gr=>`
      <div class="cat-tile" style="${gr.id===gid? 'border-color:var(--primary);background:var(--surface-2)':''}" data-select-group="${gr.id}">

  const bal = groupBalances(g);
  const settlements = settleUpGroup(bal);
  html += `

  <div class="hint" style="margin-top:-6px;">Members: ${g.members.join(", ")}</div>
  <div class="section-title">Balance</div>
  <div class="card">
    ${g.members.map(m=>{
      const v = bal[m]||0;
      return `<div class="rec-row"><div class="rec-main"><div class="rec-name">${m}</div></div>
        <div class="rec-amt" style="color:${v>=0?'var(--income)':'var(--expense)'}">${v>=0? 'Wapas milega ':'Dena hai '}${fmtINR(Math.abs(v))}</div></div>`;
    }).join("")}
  </div>
  <div class="section-title">Settle up</div>
  <div class="card">
    ${settlements.length? settlements.map(s=>`
      <div class="rec-row"><div class="rec-main"><div class="rec-name">${s.from} → ${s.to}</div></div>
        <div class="rec-amt">${fmtINR(s.amt)}</div></div>`).join("") : `<div class="empty">Sab clear hai 🎉</div>`}
  </div>
  <div class="section-title">Kharche</div>
  <div class="card">
    ${g.expenses.length? [...g.expenses].reverse().map(e=>`
      <div class="txn">
        <div class="txn-icon" style="background:var(--primary)22;color:var(--primary)">🧾</div>
        <div class="txn-main">
          <div class="txn-cat">${e.desc}</div>
          <div class="txn-note">${e.paidBy} ne pay kiya · ${e.split.length} logon mein split · ${fmtDate(e.date)}</div>
        </div>
        <div class="txn-amt expense">${fmtINR(e.amount)}</div>
        <button class="txn-del" data-del-group-exp="${e.id}" data-group="${g.id}">✕</button>
      </div>`).join("") : `<div class="empty">Abhi koi shared kharcha nahi hai</div>`}
  </div>`;
  return html;
}
function groupBalances(g){
  const bal={}; g.members.forEach(m=>bal[m]=0);
  g.expenses.forEach(e=>{
    const share = e.amount / e.split.length;
    e.split.forEach(m=> bal[m]=(bal[m]||0)-share);
    bal[e.paidBy]=(bal[e.paidBy]||0)+e.amount;
  });
  Object.keys(bal).forEach(k=> bal[k]=Math.round(bal[k]*100)/100);
  return bal;
}
function settleUpGroup(bal){
  const debtors=[], creditors=[];
  Object.entries(bal).forEach(([m,v])=>{
    if(v<-0.5) debtors.push({m,v:-v});
    else if(v>0.5) creditors.push({m,v});
  });
  const res=[]; let i=0,j=0;
  while(i<debtors.length && j<creditors.length){
    const amt = Math.min(debtors[i].v, creditors[j].v);
    res.push({from:debtors[i].m, to:creditors[j].m, amt:Math.round(amt*100)/100});
    debtors[i].v-=amt; creditors[j].v-=amt;
    if(debtors[i].v<0.5) i++;
    if(creditors[j].v<0.5) j++;
  }
  return res;
}

function renderAnalysis(){
  const cur = txnsForMonth(state.month);
  const t = totals(cur);
  const breakdown = categoryBreakdown(cur,"expense");
  const totalExp = breakdown.reduce((s,b)=>s+b.amount,0);
  const prevMonth = new Date(state.month.getFullYear(), state.month.getMonth()-1, 1);
  const prevBreakdown = categoryBreakdown(txnsForMonth(prevMonth), "expense");
  const prevAmt = id => (prevBreakdown.find(b=>b.categoryId===id)||{amount:0}).amount;

  const months = [];
  for(let i=5;i>=0;i--){ months.push(new Date(state.month.getFullYear(), state.month.getMonth()-i, 1)); }
  const trendMax = Math.max(1, ...months.map(d=> totals(txnsForMonth(d)).expense ));
  const savingsRate = t.income>0 ? Math.round(((t.income-t.expense)/t.income)*100) : null;
  const wk = weekdayBreakdown(cur);
  const wkMax = Math.max(1, ...wk.map(w=>w.amount));
  const highest = highestExpense(cur);
  const avgDaily = dailyAverage(state.month, cur);

  return `
  <div class="grid-left">
    <div class="section-title">Overview — ${monthLabel(state.month)}</div>
    <div class="card">
      <div class="bar-row">
        <div class="bar-row-top"><span class="nm">Income</span><span class="amt">${fmtINR(t.income)}</span></div>
        <div class="bar-track"><div class="bar-fill" data-w="100%" style="background:linear-gradient(90deg,var(--income),var(--income-2))"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-row-top"><span class="nm">Expense</span><span class="amt">${fmtINR(t.expense)}</span></div>
        <div class="bar-track"><div class="bar-fill" data-w="${t.income>0?Math.min(100,t.expense/t.income*100):(t.expense>0?100:0)}%" style="background:linear-gradient(90deg,var(--expense),var(--expense-2))"></div></div>
      </div>
      ${savingsRate!==null? `<div class="hint">Saving rate: <b style="color:var(--ink)">${savingsRate}%</b></div>` : ``}
      <div class="hint">Daily average kharcha: <b style="color:var(--ink)">${fmtINR(avgDaily)}</b></div>
      ${highest? `<div class="hint">Sabse bada kharcha: <b style="color:var(--ink)">${fmtINR(highest.amount)}</b> — ${catById(highest.categoryId)?.name||'-'} (${fmtDate(highest.date)})</div>` : ``}
    </div>

    <div class="section-title">Category-wise kharcha</div>
    <div class="card">
      ${breakdown.length? breakdown.map(b=>{
        const prev = prevAmt(b.categoryId);
        let trend = "";
        if(prev>0){
          const diffPct = Math.round((b.amount-prev)/prev*100);
          if(Math.abs(diffPct)>=5){
            trend = `<span style="font-size:10.5px;color:${diffPct>0?'var(--expense)':'var(--income)'};font-weight:800;">${diffPct>0?'▲':'▼'} ${Math.abs(diffPct)}%</span>`;
          }
        }
        return `
        <div class="bar-row">
          <div class="bar-row-top"><span class="nm">${b.cat.icon} ${b.cat.name}</span><span class="amt">${fmtINR(b.amount)} · ${Math.round(b.amount/totalExp*100)}% ${trend}</span></div>
          <div class="bar-track"><div class="bar-fill" data-w="${Math.round(b.amount/totalExp*100)}%" style="background:${b.cat.color}"></div></div>
        </div>`;
      }).join("") : `<div class="empty">Data nahi hai</div>`}
    </div>

    <div class="section-title">Weekday-wise kharcha pattern</div>
    <div class="card">
      ${wk.map(w=>`
        <div class="bar-row">
          <div class="bar-row-top"><span class="nm">${w.name}</span><span class="amt">${fmtINR(w.amount)}</span></div>
          <div class="bar-track"><div class="bar-fill" data-w="${Math.round(w.amount/wkMax*100)}%" style="background:linear-gradient(90deg,var(--teal),var(--blue))"></div></div>
        </div>`).join("")}
    </div>
  </div>

  <div class="grid-right">
    <div class="section-title">Pichle 6 mahine (expense)</div>
    <div class="card">
      ${months.map(d=>{
        const exp = totals(txnsForMonth(d)).expense;
        return `<div class="bar-row">
          <div class="bar-row-top"><span class="nm">${d.toLocaleDateString('en-IN',{month:'short',year:'2-digit'})}</span><span class="amt">${fmtINR(exp)}</span></div>
          <div class="bar-track"><div class="bar-fill" data-w="${Math.round(exp/trendMax*100)}%" style="background:linear-gradient(90deg,var(--grad-1),var(--grad-2))"></div></div>
        </div>`;
      }).join("")}
    </div>

    <div class="section-title">💡 Tips</div>
    <div class="card">
      ${buildTips().map(t=>`<div class="tip"><span class="tip-icon">${t.icon}</span><span class="tip-text">${t.text}</span></div>`).join("")}
    </div>

    <div class="section-title">📝 Activity log</div>
    <div class="card">
      ${DB.activityLog.length? DB.activityLog.slice(0,15).map(a=>`
        <div class="tip"><span class="tip-icon">${ACT_ICON[a.type]||"•"}</span><span class="tip-text">${a.message}<br><span style="color:var(--muted);font-size:11px;">${timeAgo(a.ts)}</span></span></div>

    <div class="card">
      <button class="btn" data-act="exportPdf">📄 Is mahine ka PDF report</button>
      <button class="btn secondary" data-act="exportData" style="margin-top:10px;">⬇️ Backup (JSON) download karo</button>

      </div>
      <div class="hint">Sara data sirf isi device ke browser mein locally save hota hai — kahin bhi upload nahi hota. Backup zaroor rakho.</div>
    </div>
  </div>
  `;
}

function ensurePdfLib(){
  if(!window.jspdf){ toast("PDF library load nahi ho payi, dobara try karo"); return false; }

function openSheet(html){
  const overlay = document.createElement("div");
  overlay.className = "sheet-overlay";
  overlay.innerHTML = `<div class="sheet">${html}</div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=> overlay.classList.add("show"));
  overlay.addEventListener("click", e=>{ if(e.target===overlay) closeSheet(overlay); });
  return overlay;
}
function closeSheet(overlay){
  overlay.classList.remove("show");
  setTimeout(()=> overlay.remove(), 260);
}

function deleteTxnWithUndo(id){
  const idx = DB.transactions.findIndex(t=>t.id===id);
  if(idx===-1) return;
  const removed = DB.transactions[idx];
  const cat = catById(removed.categoryId);
  DB.transactions.splice(idx,1);
  logActivity('delete', `${cat?.icon||'🗑️'} ${cat?.name||'Entry'} — ${fmtINR(removed.amount)} delete hui (${fmtDate(removed.date)})`);
  save(); render();
  toast("Entry delete ho gayi", {
    label:"Undo",
    onClick: ()=>{
      DB.transactions.splice(Math.min(idx, DB.transactions.length),0,removed);
      logActivity('restore', `${cat?.icon||'↩️'} ${cat?.name||'Entry'} — ${fmtINR(removed.amount)} wapas restore hui`);
      save(); render();
    }
  });
}

function safeMathEval(str){
  let s = str.trim();
  let m = s.match(/^([\d.]+)\s*%\s*(of|ka|ki|ke)\s*([\d.]+)$/i);
  if(m) return (parseFloat(m[1])/100)*parseFloat(m[3]);
  s = s.replace(/x/gi,'*').replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'');
  if(!/^[\d\s+\-*/().%]+$/.test(s) || !/\d/.test(s)) return null;
  s = s.replace(/(\d+(\.\d+)?)%/g, '($1/100)');
  try{
    const val = Function('"use strict"; return (' + s + ')')();
    if(typeof val === "number" && isFinite(val)) return val;
  }catch(e){}
  return null;
}
function botReply(msg){
  const q = msg.trim();
  const mathResult = safeMathEval(q);
  if(mathResult !== null){
    const rounded = Math.round(mathResult*100)/100;
    return `= <b>${rounded}</b>` + (Math.abs(rounded)>=1? ` (${fmtINR(rounded)})` : "");
  }
  const low = q.toLowerCase();
  const has = (...words)=> words.some(w=> low.includes(w));
  if(has("recurring","auto cut","auto-cut","autocut","emi","subscription"))
    return "Recurring ke liye: entry add karte waqt '🔁 recurring hai' tick karo, ya Recurring tab me '+ Naya' se rent/EMI/subscription set karo. Daily se lekar apna custom gap (jaise 45 din) tak set kar sakte ho — app kholte hi due wale apne aap add ho jaate hain.";
  if(has("budget"))
    return "Category ✎ (edit) me 'Monthly budget' field bhar do — us category ki tile par progress bar dikhega, aur 80%+ ya cross hone par tip bhi milegi.";
  if(has("split","group","room","trip"))
    return "Split Bill tab se group banao (members comma se likho), phir kharcha add karo — kaun kisko kitna dega automatic calculate ho jayega.";
  if(has("edit","update","badal"))
    return "Kisi bhi entry par tap karo — edit sheet khulega. Save karne par 'edited' tag lag jata hai aur uska record Analysis > Activity log me dikhta hai.";
  if(has("delete","hataye","hatao","remove"))
    return "Entry ke ✕ button se delete hoti hai — turant 'Undo' ka option toast me 4 second tak milta hai.";
  if(has("backup","restore","export","download"))
    return "Analysis tab > Data card me — PDF report, JSON backup download, aur restore, sab available hai.";
  if(has("offline","internet"))
    return "Haan, poora app offline chalta hai — data sirf tumhare is device ke browser me locally save hota hai, kahin bhi upload nahi hota.";
  if(has("category"))
    return "Category tile par tap karo to uski full detail (budget, 6-mahine trend, saari entries edit/delete) khulegi; ✎ se naam/icon/color/budget edit kar sakte ho.";
  if(has("hi","hello","hey","namaste"))
    return "Namaste! Bolo, app ke baare me kuch puchna hai ya koi calculation karni hai?";
  return "Ye samajh nahi aaya 🤔 — tum mujhse app ke features (recurring, budget, split, edit, backup, category) ke baare me puch sakte ho, ya koi bhi calculation type karo jaise '2450+1200-300' ya '18% of 5600'.";
}

        <option value="halfyearly">Half-yearly (6 mahine)</option>
        <option value="yearly">Yearly</option>
        <option value="custom">Custom...</option>
      </select>
    </div>
    <div class="field" id="customFreqWrap" style="display:${existing?.frequency==='custom'?'block':'none'};">
      <label>Custom repeat</label>
      <div style="display:flex;gap:8px;">
        <input type="number" id="f_customVal" min="1" value="${existing?.customVal||1}" style="flex:1;">
        <select id="f_customUnit" style="flex:1;">
          <option value="days" ${existing?.customUnit==='days'?'selected':''}>Din (days)</option>
          <option value="weeks" ${existing?.customUnit==='weeks'?'selected':''}>Hafte (weeks)</option>
          <option value="months" ${existing?.customUnit==='months'?'selected':''}>Mahine (months)</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Agli date (kab se cut hoga)</label><input type="date" id="f_next" value="${existing?.nextDate || new Date().toISOString().slice(0,10)}"></div>
    <button class="btn" id="saveRec">${existing? "Save karo":"Recurring banao"}</button>
    ${existing? `<button class="btn danger" id="delRec" style="margin-top:8px;">Delete karo</button>` : ``}
  `);
  function refreshCatOptions(){
    const sel = $("#f_cat", overlay);
    sel.innerHTML = DB.categories.filter(c=>c.type===type).map(c=>`<option value="${c.id}" ${existing?.categoryId===c.id?'selected':''}>${c.icon} ${c.name}</option>`).join("");
  }
  refreshCatOptions();
  if(existing) $("#f_freq",overlay).value = existing.frequency;
  $("#f_freq", overlay).addEventListener("change", function(){
    $("#customFreqWrap", overlay).style.display = this.value==="custom" ? "block" : "none";
  });
  $$("#typeSeg button", overlay).forEach(b=> b.onclick=()=>{
    type=b.dataset.type;
    $$("#typeSeg button",overlay).forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    refreshCatOptions();
  });
  $("#saveRec", overlay).onclick = ()=>{
    const amount = parseFloat($("#f_amount",overlay).value);
    const categoryId = $("#f_cat",overlay).value;
    const frequency = $("#f_freq",overlay).value;
    const customVal = frequency==="custom" ? (parseInt($("#f_customVal",overlay).value)||1) : null;
    const customUnit = frequency==="custom" ? $("#f_customUnit",overlay).value : null;
    const nextDate = $("#f_next",overlay).value;
    const note = $("#f_note",overlay).value.trim();
    if(!amount||amount<=0){ toast("Sahi amount daalo"); return; }
    if(!categoryId){ toast("Pehle category banao"); return; }
    if(existing){
      Object.assign(existing,{amount,categoryId,frequency,customVal,customUnit,nextDate,note,type});
      logActivity('edit', `🔁 recurring "${note||catById(categoryId).name}" update hua`);
    } else {
      DB.recurring.push({id:uid(),amount,categoryId,frequency,customVal,customUnit,nextDate,note,type,active:true});
      logActivity('add', `🔁 recurring "${note||catById(categoryId).name}" banaya gaya`);
    }
    save(); closeSheet(overlay); render();
    toast("Recurring save ho gaya ✅");
  };
  if(existing){
    $("#delRec",overlay).onclick = ()=>{
      DB.recurring = DB.recurring.filter(r=>r.id!==existing.id);
      logActivity('delete', `🔁 recurring "${existing.note||catById(existing.categoryId)?.name||''}" delete hua`);
      save(); closeSheet(overlay); render();
      toast("Recurring delete ho gaya");
    };
  }
}

function sheetNewGroup(){
  const overlay = openSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">Naya group banao</div>
    <div class="field"><label>Group ka naam</label><input type="text" id="g_name" placeholder="e.g. Flat 302 ya Goa Trip"></div>
    <div class="field"><label>Members (comma se separate karo)</label><input type="text" id="g_members" placeholder="You, Raj, Priya, Aman"></div>
    <button class="btn" id="saveGroup">Group banao</button>
  `);
  $("#saveGroup", overlay).onclick = ()=>{
    const name = $("#g_name", overlay).value.trim();
    const members = $("#g_members", overlay).value.split(",").map(s=>s.trim()).filter(Boolean);
    if(!name || members.length<2){ toast("Naam aur kam se kam 2 members daalo"); return; }
    const g = {id:"g_"+uid(), name, members, expenses:[]};
    DB.groups.push(g); state.group=g.id; save(); closeSheet(overlay); render();
    toast("Group ban gaya ✅");
  };
}

function sheetAddGroupExpense(gid){
  const g = DB.groups.find(x=>x.id===gid);
  if(!g) return;
  const overlay = openSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">Shared kharcha add karo</div>
    <div class="field"><label>Kis cheez ka kharcha</label><input type="text" id="e_desc" placeholder="e.g. Groceries, Cab fare"></div>
    <div class="field"><label>Amount (₹)</label><input type="number" inputmode="decimal" id="e_amount"></div>
    <div class="field"><label>Kisne pay kiya</label><select id="e_paidby">${g.members.map(m=>`<option value="${m}">${m}</option>`).join("")}</select></div>
    <div class="field"><label>Kis-kis mein split hoga</label>
      ${g.members.map(m=>`
        <div style="display:flex;align-items:center;gap:8px;padding:6px 0;">
          <input type="checkbox" checked value="${m}" class="splitChk" id="sc_${m}" style="width:18px;height:18px;">
          <label for="sc_${m}" style="margin:0;font-size:13.5px;color:var(--ink);font-weight:500;">${m}</label>
        </div>`).join("")}
    </div>
    <button class="btn" id="saveGroupExp">Kharcha add karo</button>
  `);
  $("#saveGroupExp", overlay).onclick = ()=>{
    const desc = $("#e_desc",overlay).value.trim();
    const amount = parseFloat($("#e_amount",overlay).value);
    const paidBy = $("#e_paidby",overlay).value;
    const split = $$(".splitChk:checked", overlay).map(c=>c.value);
    if(!desc || !amount || amount<=0){ toast("Sahi detail bharo"); return; }
    if(split.length===0){ toast("Kam se kam ek member select karo"); return; }
    g.expenses.push({id:uid(), desc, amount, paidBy, split, date:new Date().toISOString().slice(0,10)});
    save(); closeSheet(overlay); render();
    toast("Kharcha add ho gaya ✅");
  };
}

function bindGlobalEvents(){
  $$("[data-tab]").forEach(el=> el.onclick = ()=>{
    const tab = el.dataset.tab;
    if(tab==="add"){ sheetAddTransaction(); return; }
    state.tab = tab; render();
  });
  const prevBtn = $('[data-act="prevMonth"]');
  if(prevBtn) prevBtn.onclick = ()=>{ state.month = new Date(state.month.getFullYear(), state.month.getMonth()-1, 1); render(); };
  const nextBtn = $('[data-act="nextMonth"]');
  if(nextBtn) nextBtn.onclick = ()=>{ state.month = new Date(state.month.getFullYear(), state.month.getMonth()+1, 1); render(); };

  $$('[data-edit-txn]').forEach(el=> el.onclick = ()=> sheetAddTransaction(DB.transactions.find(t=>t.id===el.dataset.editTxn)));
  $$('[data-del-txn]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation(); deleteTxnWithUndo(el.dataset.delTxn); });

  const searchInput = $('#txnSearch');
  if(searchInput) searchInput.oninput = (e)=>{ state.txnSearch = e.target.value; render(); };
  $$('[data-filter-type]').forEach(el=> el.onclick = ()=>{ state.txnFilterType = el.dataset.filterType; render(); });

  $$('[data-view-cat]').forEach(el=> el.onclick = ()=> sheetCategoryReport(el.dataset.viewCat));
  $$('[data-edit-cat]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation(); sheetCategory(null, catById(el.dataset.editCat)); });
  const newExp = $('[data-act="newCategoryExpense"]'); if(newExp) newExp.onclick = ()=> sheetCategory("expense");
  const newInc = $('[data-act="newCategoryIncome"]'); if(newInc) newInc.onclick = ()=> sheetCategory("income");

  const newRec = $('[data-act="newRecurring"]'); if(newRec) newRec.onclick = ()=> sheetRecurring();
  $$('[data-edit-rec]').forEach(el=> el.onclick = ()=> sheetRecurring(DB.recurring.find(r=>r.id===el.dataset.editRec)));
  $$('[data-toggle-rec]').forEach(el=> el.onclick = (e)=>{
    e.stopPropagation();
    const r = DB.recurring.find(x=>x.id===el.dataset.toggleRec);
    r.active = !r.active; save(); render();
  });

  $$('[data-select-group]').forEach(el=> el.onclick = ()=>{ state.group = el.dataset.selectGroup; render(); });
  const newGroupBtn = $('[data-act="newGroup"]'); if(newGroupBtn) newGroupBtn.onclick = sheetNewGroup;
  $$('[data-act="addGroupExpense"]').forEach(el=> el.onclick = ()=> sheetAddGroupExpense(el.dataset.group));
  $$('[data-del-group-exp]').forEach(el=> el.onclick = (e)=>{
    e.stopPropagation();
    const gid = el.dataset.group, eid = el.dataset.delGroupExp;
    const g = DB.groups.find(x=>x.id===gid);
    if(!g) return;
    g.expenses = g.expenses.filter(x=>x.id!==eid);
    save(); render();
  });

  const pdfBtn = $('[data-act="exportPdf"]'); if(pdfBtn) pdfBtn.onclick = exportFullPDF;
  const expBtn = $('[data-act="exportData"]'); if(expBtn) expBtn.onclick = exportData;
  const resetBtn = $('[data-act="resetData"]'); if(resetBtn) resetBtn.onclick = ()=>{
    if(confirm("Pakka? Sara data (categories, entries, recurring, groups, logs) hamesha ke liye mit jayega.")){
      DB = defaultData(); save(); render(); toast("Sab data reset ho gaya");
    }
  };
  const importFile = $('#importFile'); if(importFile) importFile.onchange = importData;

  const fab = $('#assistantFab'); if(fab) fab.onclick = sheetAssistant;
}

function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `kharcha-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast("Backup download ho gaya");
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.categories || !parsed.transactions) throw new Error("bad file");
      if(!confirm("Backup restore karne se current data overwrite ho jayega. Continue?")) return;
      if(!parsed.groups) parsed.groups = [];
      if(!parsed.recurring) parsed.recurring = [];
      if(!parsed.activityLog) parsed.activityLog = [];
      if(!parsed.botChat) parsed.botChat = [];
      if(!parsed.reminders) parsed.reminders = [];
      DB = parsed; save(); render();
      toast("Backup restore ho gaya ✅");
    }catch(err){ toast("Ye file valid backup nahi hai"); }
  };
  reader.readAsText(file);
}

(function boot(){
  const created = runRecurringEngine();
  render();
  if(created>0) setTimeout(()=> toast(`${created} recurring entry automatic add ho gayi`), 500);
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
